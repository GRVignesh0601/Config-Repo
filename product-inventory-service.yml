server:
  port: 8085

spring:
  application:
    name: PRODUCT-INVENTORY-SERVICE

  data:
    mongodb:
      uri: mongodb://localhost:27017/Product_Inventory

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

services:
  product:
    url: http://product-service
  order:
    url: http://order-service
  payment:
    url: http://payment-service
