server:
  port: 8083

spring:
  application:
    name: USER-SERVICE

  data:
    mongodb:
      host: localhost
      port: 27017
      database: kira

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

info:
  app:
    name: USER-SERVICE
    version: SNAPSHOT-1.0.0

# -----------------------------
# Custom Logstash & Environment Variables
# -----------------------------
LOGSTASH_HOST: localhost
LOGSTASH_PORT: 5000
APP_ENV: dev
